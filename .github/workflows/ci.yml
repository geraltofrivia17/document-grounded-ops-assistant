name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (mocked provider, no API key)
        run: pytest
      - name: Frozen evaluation set unchanged
        run: python -m ops_assistant eval freeze --check

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ops-assistant .
      - name: Smoke test with the offline mock
        run: |
          docker run -d --name ops -p 8000:8000 \
            -e OPS_PROVIDER=mock -e OPS_RETRIEVAL_MODE=keyword ops-assistant
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/ask \
            -H "Content-Type: application/json" \
            -d '{"question": "What mileage rate can I claim for my own car?"}'
          docker logs ops
          docker rm -f ops
